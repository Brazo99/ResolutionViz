# pyproject package configuration
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutionviz-backend"
version = "1.0.0"
description = "FastAPI backend for the ResolutionViz propositional resolution visualizer"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = [
    "api",
    "api.*",
    "logicEngine",
    "logicEngine.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"